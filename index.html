<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoiceFlow</title>
    <style>
      /* Critical CSS to prevent flash - matches the --background token */
      html.dark {
        background-color: #0e0e11;
        color-scheme: dark;
      }
      html.dark body {
        background-color: #0e0e11;
        color: #f4f4f6;
      }
      html:not(.dark) {
        background-color: #ffffff;
        color-scheme: light;
      }
      html:not(.dark) body {
        background-color: #ffffff;
        color: #0a0a0a;
      }
      html, body {
        min-height: 100vh;
        margin: 0;
      }
    </style>
    <script>
      // Identify window type immediately for CSS scoping
      (function() {
        // Extract first path segment as window identifier
        const firstSegment = window.location.pathname.split('/').filter(Boolean)[0] || '';
        document.documentElement.setAttribute('data-window-path', firstSegment);

        // Every window follows the system appearance. The document starts
        // marked dark so a dark desktop never flashes white; on a light one the
        // class comes off before the first paint.
        if (!window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
