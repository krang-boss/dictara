<!--
  The menu bar icon: a waveform inside a circle.

  Source: https://www.svgrepo.com (circle-waveform-lines). Drawn in pure black
  on transparency because the tray registers it as a macOS template image —
  only the alpha channel is used, and AppKit paints it to match the menu bar,
  so it follows light and dark appearance for free.

  The viewBox is tightened to the stroke's outer edge plus half a unit, so the
  glyph fills the bar without its antialiasing being clipped.

  This file is the source; `tray-icon.png` (44px) and `tray-icon@2x.png` (88px)
  are rendered from it. AppKit draws the icon at a fixed 18pt regardless of the
  file's size, so both are oversampled on purpose — that is what keeps the
  stroke crisp on a Retina display.
-->
<svg viewBox="1.5 1.5 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path
    d="M7.5 11V13M13.5 8V16M10.5 10V14M16.5 10.5V13.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
    stroke="#000000"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
